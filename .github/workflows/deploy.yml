name: Deploy to Server

on:
  push:
    branches: [ "deploy" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build-nocdn

      - name: Preflight - validate secrets
        id: preflight
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_KEY  || vars.SSH_KEY  }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
        run: |
          set -e
          # Validate all required secrets are present
          for v in SSH_HOST SSH_PORT SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error title=Missing config::Environment variable $v is empty. Please set it in Repository Secrets or Variables.";
              exit 1;
            fi
          done
          # Mask the key for security (prevents it from appearing in logs)
          echo "::add-mask::${SSH_KEY}"
          # Output summary (non-sensitive values only)
          echo "host=${SSH_HOST}" >> $GITHUB_OUTPUT
          echo "port=${SSH_PORT}" >> $GITHUB_OUTPUT
          echo "user=${SSH_USER}" >> $GITHUB_OUTPUT
          echo "path=${DEPLOY_PATH}" >> $GITHUB_OUTPUT
          echo "✓ All required secrets validated"

      - name: Upload build to server and release switch (DNMP)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_KEY  || vars.SSH_KEY  }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
        run: |
          set -e
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR="$DEPLOY_PATH/releases/$TIMESTAMP"
          echo "$SSH_KEY" > key && chmod 600 key
          
          # 确保远程目录存在
          ssh -i key -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "\
            mkdir -p $DEPLOY_PATH/releases $DEPLOY_PATH"
          
          # 上传构建产物
          echo "Uploading files to $RELEASE_DIR..."
          rsync -az --delete -e "ssh -i key -p $SSH_PORT -o StrictHostKeyChecking=no" ./dist/ $SSH_USER@$SSH_HOST:$RELEASE_DIR/
          
          # 验证上传是否成功（检查 index.html 是否存在）
          echo "Verifying deployment..."
          if ssh -i key -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "[ ! -f $RELEASE_DIR/index.html ]"; then
            echo "::error::Deployment failed: index.html not found in $RELEASE_DIR"
            exit 1
          fi
          
          # 创建软链接并重载 Nginx
          echo "Creating symlink and reloading Nginx..."
          ssh -i key -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "\
            rm -rf $DEPLOY_PATH/current && \
            ln -sfn $RELEASE_DIR $DEPLOY_PATH/current && \
            docker exec nginx nginx -t && \
            docker exec nginx nginx -s reload && \
            ls -1dt $DEPLOY_PATH/releases/* | tail -n +4 | xargs -r rm -rf"
          
          echo "✓ Deployment successful: $RELEASE_DIR -> $DEPLOY_PATH/current"


