name: Deploy to Server

on:
  push:
    branches: [ "deploy" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build-nocdn

      - name: Preflight - resolve config and validate
        id: preflight
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_KEY  || vars.SSH_KEY  }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          TYPEWORDS: ${{ secrets.TYPEWORDS }}
        run: |
          set -e
          # If bundled secret TYPEWORDS is provided, parse KEY=VALUE lines to fill missing vars
          if [ -n "${TYPEWORDS}" ]; then
            echo "TYPEWORDS secret detected - attempting to parse"
            echo "${TYPEWORDS}" > preflight.env
            # Normalize CRLF to LF and ignore comment/empty lines
            sed -i 's/\r$//' preflight.env
            while IFS='=' read -r k v; do
              [ -z "$k" ] && continue
              case "$k" in \#*) continue;; esac
              case "$k" in
                SSH_HOST|SSH_PORT|SSH_USER|SSH_KEY|DEPLOY_PATH)
                  # Only set if current env empty
                  eval "cur=\"\${$k}\""
                  if [ -z "$cur" ]; then
                    # Preserve multi-line SSH_KEY
                    if [ "$k" = "SSH_KEY" ]; then
                      # Capture the rest of the file for SSH_KEY (supports multi-line)
                      # Reconstruct from the current line (v) and any following lines until END marker
                      awk 'f{print} /BEGIN OPENSSH PRIVATE KEY/{f=1} END{}' preflight.env > sshkey.tmp || true
                      if grep -q "BEGIN OPENSSH PRIVATE KEY" sshkey.tmp && grep -q "END OPENSSH PRIVATE KEY" sshkey.tmp; then
                        export SSH_KEY="$(cat sshkey.tmp)"
                      else
                        export SSH_KEY="$v"
                      fi
                    else
                      eval "export $k=\"$v\""
                    fi
                  fi
                ;;
              esac
            done < preflight.env
          fi
          for v in SSH_HOST SSH_PORT SSH_USER SSH_KEY DEPLOY_PATH; do
            if [ -z "${!v}" ]; then
              echo "::error title=Missing config::Environment variable $v is empty. Please set it in Repository Secrets or Variables.";
              exit 1;
            fi
          done
          # Mask the key and output a compact summary
          echo "::add-mask::${SSH_KEY}"
          echo "host=${SSH_HOST}" >> $GITHUB_OUTPUT
          echo "port=${SSH_PORT}" >> $GITHUB_OUTPUT
          echo "user=${SSH_USER}" >> $GITHUB_OUTPUT
          echo "path=${DEPLOY_PATH}" >> $GITHUB_OUTPUT

      - name: Upload build to server and release switch (DNMP)
        env:
          SSH_HOST: ${{ steps.preflight.outputs.host }}
          SSH_PORT: ${{ steps.preflight.outputs.port }}
          SSH_USER: ${{ steps.preflight.outputs.user }}
          SSH_KEY:  ${{ secrets.SSH_KEY || vars.SSH_KEY }}
          DEPLOY_PATH: ${{ steps.preflight.outputs.path }}
        run: |
          set -e
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR="$DEPLOY_PATH/releases/$TIMESTAMP"
          echo "$SSH_KEY" > key && chmod 600 key
          rsync -az --delete -e "ssh -i key -p $SSH_PORT -o StrictHostKeyChecking=no" ./dist/ $SSH_USER@$SSH_HOST:$RELEASE_DIR/
          ssh -i key -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "\
            mkdir -p $DEPLOY_PATH/releases $DEPLOY_PATH && \
            ln -sfn $RELEASE_DIR $DEPLOY_PATH/current && \
            (docker exec nginx nginx -s reload || true) && \
            ls -1dt $DEPLOY_PATH/releases/* | tail -n +4 | xargs -r rm -rf"


